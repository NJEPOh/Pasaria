<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Pasaria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>PASARIA</h2>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-title">Main menu</p>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="admin-orders.html">Order Management</a></li>
                    <li><a href="admin-customers.html">Customers</a></li>
                    <li><a href="admin-categories.html">Categories</a></li>
                    <li><a href="admin-transactions.html">Transaction</a></li>
                </ul>
                <p class="nav-title">Product</p>
                <ul>
                    <li class="active"><a href="admin-add-product.html">Add Products</a></li>
                    <li><a href="admin-product-list.html">Product List</a></li>
                    <li><a href="admin-reviews.html">Product Reviews</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline"
                    style="width: 100%; margin-bottom: 16px; border-color: var(--border-strong); color: var(--text-primary); justify-content: center;"
                    onclick="window.location.href='index.html'">
                    🏠 Kembali ke Toko
                </button>
                <div style="font-weight: 600; font-size: 14px;">Dealport Admin</div>
                <div style="font-size: 12px; color: var(--text-muted);">admin@pasaria.com</div>
            </div>
        </aside>
        <main class="dashboard-main">

            <header class="dashboard-header">
                <h2>Dashboard</h2>
                <div class="header-actions">
                    <input type="text" placeholder="Search data, users, or reports" class="dashboard-search">
                    <div style="font-size: 20px;">🔔</div>
                    <div
                        style="width: 32px; height: 32px; background: var(--secondary-main); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">
                        A</div>
                </div>
            </header>
            <div class="dashboard-content">
                <div class="card-flat" style="padding: 32px; max-width: 800px;">
                    <h2 style="font-size: 20px; margin-bottom: 24px;">Add New Product</h2>
                    <form id="addProductForm">
                        <div class="form-group">
                            <label class="form-label">Product Image</label>
                            <div
                                style="border: 2px dashed var(--border-strong); padding: 40px; text-align: center; border-radius: var(--radius-md); background: var(--bg-secondary);">
                                <p style="color: var(--text-muted); font-size: 14px;">Gambar sementara akan menggunakan
                                    placeholder</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="prodName" class="form-input"
                                placeholder="Contoh: Jaket Kulit Sintetis" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <select id="prodCategory" class="form-input">
                                    <option value="2">Pakaian & Fashion</option>
                                    <option value="1">Makanan & Minuman</option>
                                    <option value="3">Kerajinan & Rumah</option>
                                    <option value="4">Aksesoris & Hobi</option>
                                    <option value="5">Perawatan Diri</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Price (Rp)</label>
                                <input type="number" id="prodPrice" class="form-input" placeholder="0" required>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Stock</label>
                                <input type="number" id="prodStock" class="form-input" placeholder="0" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Weight (Gram)</label>
                                <input type="number" id="prodWeight" class="form-input" placeholder="0">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="prodDesc" class="form-textarea"
                                placeholder="Jelaskan detail produk..."></textarea>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 16px;">
                            <input type="checkbox" id="prodUmkm" style="width: 18px; height: 18px;">
                            <label for="prodUmkm" style="font-weight: 600; color: var(--text-primary);">Tandai sebagai
                                Produk UMKM</label>
                        </div>
                        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px;">
                            <button type="button" class="btn btn-outline"
                                onclick="window.location.href='index.html'">Batal</button>
                            <button type="submit" class="btn btn-primary">Publish Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('addProductForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Mencegah form melakukan reload halaman bawaan
            try {
                // 1. Ambil data dari localStorage atau fetch JSON jika belum ada
                let db = JSON.parse(localStorage.getItem('pasaria_db'));
                if (!db) {
                    const response = await fetch('data/db.json');
                    db = await response.json();
                }
                // 2. Tentukan ID baru (selalu +1 dari ID terakhir)
                const newId = db.products.length > 0 ? db.products[db.products.length - 1].id + 1 : 1;
                // 3. Susun objek produk baru berdasarkan input form
                const newProduct = {
                    id: newId,
                    store_id: 1, // Default toko
                    category_id: parseInt(document.getElementById('prodCategory').value),
                    product_name: document.getElementById('prodName').value,
                    slug: "produk-baru-" + newId,
                    price: parseInt(document.getElementById('prodPrice').value),
                    rating_avg: 0,
                    total_sales: 0,
                    stock: parseInt(document.getElementById('prodStock').value),
                    weight: parseInt(document.getElementById('prodWeight').value) || 200,
                    description: document.getElementById('prodDesc').value || "Produk baru dari Admin.",
                    image_url: "https://placehold.co/400x400/E7E1F7/1D0251?text=Produk+Baru", // Placeholder sementara
                    is_umkm: document.getElementById('prodUmkm').checked
                };
                // 4. Masukkan ke awal array agar muncul paling atas di halaman utama
                db.products.unshift(newProduct);
                // 5. Simpan kembali ke localStorage
                localStorage.setItem('pasaria_db', JSON.stringify(db));
                // 6. Notifikasi sukses & redirect
                alert('Produk berhasil dipublish!');
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Gagal menyimpan produk:", error);
                alert("Terjadi kesalahan saat menyimpan produk.");
            }
        });
    </script>
</body>
</html>
