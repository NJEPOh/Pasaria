<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Pasaria</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>PASARIA</h2>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-title">Main menu</p>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="admin-orders.html">Order Management</a></li>
                    <li><a href="admin-customers.html">Customers</a></li>
                    <li><a href="admin-categories.html">Categories</a></li>
                    <li><a href="admin-transactions.html">Transaction</a></li>
                </ul>
                <p class="nav-title">Product</p>
                <ul>
                    <li><a href="admin-add-product.html">Add Products</a></li>
                    <li><a href="admin-product-list.html">Product List</a></li>
                    <li><a href="admin-reviews.html">Product Reviews</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline"
                    style="width: 100%; margin-bottom: 16px; border-color: var(--border-strong); color: var(--text-primary); justify-content: center;"
                    onclick="window.location.href='index.html'">
                    🏠 Kembali ke Toko
                </button>

                <div style="font-weight: 600; font-size: 14px;">Dealport Admin</div>
                <div style="font-size: 12px; color: var(--text-muted);">admin@pasaria.com</div>
            </div>
        </aside>

        <main class="dashboard-main">

            <header class="dashboard-header">
                <h2>Dashboard</h2>
                <div class="header-actions">
                    <input type="text" placeholder="Search data, users, or reports" class="dashboard-search">
                    <div style="font-size: 20px;">🔔</div>
                    <div
                        style="width: 32px; height: 32px; background: var(--secondary-main); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">
                        A</div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="card-flat" style="padding: 32px; max-width: 800px;">
                    <h2 style="font-size: 20px; margin-bottom: 24px;">Add New Product</h2>

                    <form action="#" onsubmit="event.preventDefault(); alert('Produk berhasil disimpan!');">
                        <div class="form-group">
                            <label class="form-label">Product Image</label>
                            <div
                                style="border: 2px dashed var(--border-strong); padding: 40px; text-align: center; border-radius: var(--radius-md); background: var(--bg-secondary);">
                                <p style="color: var(--text-muted); font-size: 14px;">Klik atau drag file gambar ke sini
                                </p>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-input" placeholder="Contoh: Jaket Kulit Sintetis">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <select class="form-input">
                                    <option>Pakaian</option>
                                    <option>Barang Elektronik</option>
                                    <option>Perabot</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Price (Rp)</label>
                                <input type="number" class="form-input" placeholder="0">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Stock</label>
                                <input type="number" class="form-input" placeholder="0">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Weight (Gram)</label>
                                <input type="number" class="form-input" placeholder="0">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea class="form-textarea" placeholder="Jelaskan detail produk..."></textarea>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px;">
                            <button type="button" class="btn btn-outline">Save as Draft</button>
                            <button type="submit" class="btn btn-primary">Publish Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
